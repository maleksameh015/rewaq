<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070d18"><title>السبحة الإلكترونية | رِوَاق</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#070d18;color:#f8fafc;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,420px);text-align:center;background:#0f172a;border:1px solid #1e3b36;border-radius:24px;padding:28px;box-shadow:0 18px 50px #0005}.brand{color:#fbbf24;font-size:14px}.count{font-size:64px;font-weight:bold;color:#34d399;margin:28px 0}.btn{border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:bold;cursor:pointer;background:#10b981;color:#052e24;margin:5px}.secondary{background:#263548;color:#e2e8f0}.hint{color:#94a3b8;font-size:13px;line-height:1.8}a{color:#34d399;text-decoration:none;display:inline-block;margin-top:20px}</style></head>
<body><main class="card"><div class="brand">رِوَاق · حسنات</div><h1>السبحة الإلكترونية</h1><p class="hint">استعن بالله وأكثر من الذكر، واجعلها وسيلة للتذكير لا بديلًا عن حضور القلب.</p><div id="count" class="count" aria-live="polite">0</div><button class="btn" id="increment">تسبيح +</button><button class="btn secondary" id="reset">إعادة العد</button><p class="hint">العداد يعمل على هذا الجهاز ولا يُحفظ في حسابك.</p><a href="{{ url_for('hasanat') }}">العودة إلى حسنات رِوَاق</a></main><script>let n=0;const out=document.getElementById('count');document.getElementById('increment').addEventListener('click',()=>{n++;out.textContent=n});document.getElementById('reset').addEventListener('click',()=>{n=0;out.textContent=n});</script></body></html>
