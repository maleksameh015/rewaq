<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J04WRJG1B7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-J04WRJG1B7');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1a">
    <meta name="description" content="منصة تعليمية متكاملة لطلاب البكالوريا والثانوية العامة">
    <title>تسجيل الدخول - منصة رِوَاق</title>
    
    <!-- كود التحقق من جوجل -->
    <meta name="google-site-verification" content="pLF0j7ZDSt-KKoTGk3WC2sbJUlyAKsXxPbiZ0QEwPMg" />

    <!-- ملف Web Manifest للتطبيقات PWA -->
    <link rel="manifest" href="{{ url_for('manifest') }}">

    <!-- أيقونة الموقع (Favicon) واللوجو -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v=99">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}?v=99">

    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; }
        body { 
            background-color: #0f172a; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            padding: 35px 24px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
            text-align: center; 
        }
        .card-header {
            margin-bottom: 25px;
        }
        .card-header i {
            font-size: 45px;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .card h2 { 
            color: #38bdf8; 
            font-size: 22px; 
            font-weight: bold;
        }
        .card p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-box { 
            width: 100%; 
            padding: 14px 14px 14px 40px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #fff; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none; 
            transition: border-color 0.3s ease; 
        }
        .input-box:focus { border-color: #38bdf8; }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }
        .btn { 
            width: 100%; 
            padding: 14px; 
            background: #38bdf8; 
            border: none; 
            color: #0f172a; 
            font-weight: bold; 
            font-size: 16px; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-top: 8px; 
            transition: 0.3s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { background: #0284c7; color: #ffffff; }
        .link-text { margin-top: 22px; font-size: 14px; color: #94a3b8; }
        .link-text a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        .link-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <i class="fa-solid fa-right-to-bracket"></i>
            <h2>تسجيل الدخول</h2>
            <p>أهلاً بك مجدداً في منصة رِوَاق</p>
        </div>

        {% if error %}
        <div role="alert" style="background:#3f1720;border:1px solid #be123c;color:#fecdd3;padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.8;">
            {{ error }}
            <br><a href="{{ url_for('register', first_time='1', identifier=prefill_identifier) }}" style="color:#7dd3fc;font-weight:bold;">إنشاء حساب جديد</a>
        </div>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="input-group">
                <input type="text" name="identifier" class="input-box" placeholder="رقم الهاتف أو بريد المدير" value="{{ prefill_identifier|default('') }}" required>
                <i class="fa-solid fa-user input-icon"></i>
            </div>
            
            <div class="input-group">
                <input type="password" name="password" class="input-box" placeholder="كلمة المرور" required>
                <i class="fa-solid fa-lock input-icon"></i>
            </div>

            <button type="submit" class="btn">
                <i class="fa-solid fa-right-to-bracket"></i> دخول
            </button>
        </form>

        <p style="font-size:12px;color:#94a3b8;margin-top:12px;line-height:1.8;">المدير: استخدم البريد المحدد وكلمة مرور الإدارة.</p>
        <p class="link-text">ليس لديك حساب؟ <a href="{{ url_for('register') }}">أنشئ حساب جديد</a></p>
    </div>

    <!-- تسجيل الـ Service Worker لمتطلبات تطبيقات الويب PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('service_worker') }}")
                    .then(reg => console.log('ServiceWorker registered:', reg))
                    .catch(err => console.log('ServiceWorker failed:', err));
            });
        }
    </script>
</body>
</html>
