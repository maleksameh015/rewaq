<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>قسم حسنات - منصة السعيد</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v=99">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #121826;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-glow: rgba(168, 85, 247, 0.15);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 16px; 
            padding-top: 90px;
            padding-bottom: 30px;
            min-height: 100vh; 
        }

        .container { 
            max-width: 480px; 
            margin: 0 auto; 
        }

        /* شريط التنقل العلوي النيون */
        .neon-navbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 480px;
            height: 62px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1.5px solid #1e293b;
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.2);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding: 0 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #38bdf8;
            font-size: 11px;
            font-weight: bold;
            gap: 3px;
            flex: 1;
            transition: all 0.3s ease;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #ffffff; }

        .active-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px #00d2ff;
            margin-top: -12px;
            border: 2px solid #ffffff;
        }

        .active-wrapper i { font-size: 22px; color: #ffffff; }

        .active-indicator {
            width: 25px;
            height: 3px;
            background: linear-gradient(90deg, #ff007f, #00d2ff);
            border-radius: 2px;
            margin-top: 2px;
            box-shadow: 0 0 8px #00d2ff;
        }

        /* قائمة الأقسام الرئيسية */
        .hasanat-feed {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .section-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, border-color 0.2s;
        }

        .section-card:active {
            transform: scale(0.98);
        }

        .card-header-line {
            height: 4px;
            background: linear-gradient(90deg, #c084fc, #e879f9);
            position: relative;
        }

        .card-header-line::after {
            content: 'الإضافات المتميزة';
            position: absolute;
            top: -10px;
            right: 50%;
            transform: translateX(50%);
            background: var(--bg-color);
            padding: 0 12px;
            color: #d8b4fe;
            font-size: 13px;
            font-weight: 600;
        }

        .card-body-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 18px 18px 18px;
            text-decoration: none;
            color: var(--text-main);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: right;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-sub);
        }

        .card-icon-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.2) 0%, rgba(18, 24, 38, 0.8) 100%);
            border: 1.5px solid #a855f7;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            flex-shrink: 0;
        }

        .card-icon-wrapper i {
            font-size: 22px;
            color: #e9d5ff;
        }
    </style>
</head>
<body>

    <!-- شريط النيون العلوي -->
    <nav class="neon-navbar">
        <a href="{{ url_for('chat') }}" class="nav-item">
            <i class="fa-solid fa-play"></i>
            <span>مهامك</span>
        </a>

        <a href="{{ url_for('index') }}" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>

        <a href="{{ url_for('hasanat') }}" class="nav-item active">
            <div class="active-wrapper">
                <i class="fa-solid fa-hand-holding-heart"></i>
            </div>
            <div class="active-indicator"></div>
        </a>
    </nav>

    <div class="container">
        <div class="hasanat-feed">

            <!-- 1. القرآن الكريم بالسور -->
            <div class="section-card">
                <div class="card-header-line"></div>
                <a href="{{ url_for('quran_surahs') }}" class="card-body-link">
                    <div class="card-content">
                        <span class="card-title">القران الكريم بالسور</span>
                        <span class="card-desc">القرآن مفصل بالسور</span>
                    </div>
                    <div class="card-icon-wrapper">
                        <i class="fa-solid fa-kaaba"></i>
                    </div>
                </a>
            </div>

            <!-- 2. القرآن الكريم بالأجزاء -->
            <div class="section-card">
                <div class="card-header-line"></div>
                <a href="{{ url_for('quran_juz') }}" class="card-body-link">
                    <div class="card-content">
                        <span class="card-title">القرآن الكريم بالاجزاء</span>
                        <span class="card-desc">القران مفصل بالاجزاء</span>
                    </div>
                    <div class="card-icon-wrapper">
                        <i class="fa-solid fa-book-quran"></i>
                    </div>
                </a>
            </div>

            <!-- 3. أدعية هامة -->
            <div class="section-card">
                <div class="card-header-line"></div>
                <a href="{{ url_for('ad3yah') }}" class="card-body-link">
                    <div class="card-content">
                        <span class="card-title">أدعية هامة</span>
                        <span class="card-desc">ادعية متنوعة قد تفيدك</span>
                    </div>
                    <div class="card-icon-wrapper">
                        <i class="fa-solid fa-hands-praying"></i>
                    </div>
                </a>
            </div>

            <!-- 4. الأذكار والأحاديث -->
            <div class="section-card">
                <div class="card-header-line"></div>
                <a href="{{ url_for('azkar_hadith_menu') }}" class="card-body-link">
                    <div class="card-content">
                        <span class="card-title">الأذكار والاحاديث</span>
                        <span class="card-desc">اذكار المساء والصباح والاحاديث</span>
                    </div>
                    <div class="card-icon-wrapper">
                        <i class="fa-solid fa-star-and-crescent"></i>
                    </div>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
