<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم بالأجزاء</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .juz-card { background: #1e293b; border-radius: 10px; padding: 20px; border: 1px solid #334155; text-decoration: none; color: #fff; font-weight: bold; display: block; transition: 0.2s; }
        .juz-card:hover { background: #334155; border-color: #38bdf8; }
    </style>
</head>
<body>
    <a href="/hasanat" class="back-btn">← العودة لقسم حسانات</a>
    <h1>القرآن الكريم بالأجزاء (30 جزء)</h1>
    <div class="grid" id="juz-grid"></div>

    <script>
        const grid = document.getElementById('juz-grid');
        for (let i = 1; i <= 30; i++) {
            const a = document.createElement('a');
            a.className = 'juz-card';
            a.href = `https://quran.com/juz/${i}`;
            a.target = '_blank';
            a.innerText = `الجزء ${i}`;
            grid.appendChild(a);
        }
    </script>
</body>
</html>
