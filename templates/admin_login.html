<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن - منصة رِوَاق</title>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --shadow: rgba(0, 0, 0, 0.4);
            --input-bg: #0f172a;
            --error-color: #ef4444;
            --btn-bg: #0284c7;
            --btn-hover: #0369a1;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #0284c7;
            --shadow: rgba(0, 0, 0, 0.08);
            --input-bg: #f1f5f9;
            --btn-bg: #0284c7;
            --btn-hover: #0369a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        
        .top-navbar {
            position: absolute;
            top: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .btn-back { display: inline-flex; align-items: center; gap: 8px; background: var(--card-bg); color: var(--text-color); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; border: 1px solid var(--border-color); }
        .theme-toggle-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        .login-box { 
            background: var(--card-bg); 
            padding: 35px 25px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 10px 25px var(--shadow); 
            text-align: center;
            margin-top: 40px;
        }

        .login-box h2 {
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        input { 
            width: 100%; 
            padding: 12px 15px; 
            margin: 15px 0; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--text-color); 
            box-sizing: border-box; 
            text-align: center; 
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button.btn-login { 
            width: 100%; 
            padding: 12px; 
            background: var(--btn-bg); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px;
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.btn-login:hover {
            background: var(--btn-hover);
        }

        .error { 
            color: var(--error-color); 
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px; 
            font-size: 14px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="{{ url_for('index') }}" class="btn-back"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    </div>

    <div class="login-box">
        <h2><i class="fa-solid fa-user-shield"></i> لوحة تحكم الأدمن</h2>
        
        {% if error %}
            <div class="error"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('admin') }}">
            <input type="email" name="admin_email" placeholder="البريد الإلكتروني للمدير" value="maleksameh015@gmail.com" required autocomplete="username">
            <input type="password" name="auth_password" placeholder="كلمة مرور الإدارة" required autocomplete="current-password">
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
        </form>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            icon.className = theme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    </script>
</body>
</html>
